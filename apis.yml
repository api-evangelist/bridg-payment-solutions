aid: bridg-payment-solutions
name: Bridg Payment Solutions
description: Bridg Payment Solutions Ltd. is a Dubai-based fintech founded in 2013 by Moussa Beidas and
  Nadim Jarudi. Its patent-pending OneConnect technology turns any smartphone into a point-of-sale terminal
  and mobile wallet, using Bluetooth to let two phones exchange card payments even when only one (or neither)
  has an internet connection by treating the devices as a network of offline ledgers. Bridg targets delivery
  drivers, in-flight retail on low-cost carriers, and merchants who need to accept debit and credit card
  payments without dedicated hardware, and offers the product white-labeled to merchants and payment partners.
  The company advertises PCI DSS and Visa compliance and is backed by 500 Global, TURN8, MetLife Foundation,
  Village Capital, and the European Commission. This profile was enriched from the public marketing site;
  Bridg publishes no public API, developer portal, or SDK at this time.
